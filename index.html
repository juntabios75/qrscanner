<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBHS - QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            touch-action: manipulation;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-height: 99vh;
            overflow-y: auto;
        }
        .header { text-align: center; margin-bottom: 12px; }
        .header h2 { color: #2c3e50; font-size: 20px; }
        .header p { color: #7f8c8d; font-size: 13px; }
        #reader-container {
            width: 100%;
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            min-height: 300px;
            max-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block;
        }
        #result { margin-top: 12px; text-align: center; min-height: 40px; font-size: 14px; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .btn-primary { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; }
        .btn-primary:active { transform: scale(0.95); }
        .btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; }
        .btn-danger:active { transform: scale(0.95); }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-group .btn { flex: 1; min-width: 80px; }
        .status-box {
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            text-align: center;
            font-size: 13px;
        }
        .status-success { background: #d4edda; color: #155724; border-left: 3px solid #28a745; }
        .status-error { background: #f8d7da; color: #721c24; border-left: 3px solid #dc3545; }
        .status-info { background: #d1ecf1; color: #0c5460; border-left: 3px solid #17a2b8; }
        .status-warning { background: #fff3cd; color: #856404; border-left: 3px solid #ffc107; }
        .hidden { display: none !important; }
        .scanned-data {
            background: #d4edda;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #28a745;
            margin: 8px 0;
            text-align: left;
            font-size: 13px;
        }
        .scanned-data .label { font-weight: 600; color: #2c3e50; }
        .scanned-data .value { color: #155724; font-weight: 500; }
        .scan-animation {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 6px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        @media (max-width: 500px) {
            .container { padding: 12px 14px; }
            #reader-container { min-height: 250px; max-height: 300px; }
            .header h2 { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📷 QR Code Scanner</h2>
            <p>Scan the QR code to mark attendance</p>
        </div>

        <div id="statusMessage" class="status-box status-info">
            <span class="scan-animation"></span> Initializing camera...
        </div>

        <div id="reader-container">
            <div id="reader"></div>
        </div>

        <div id="result"></div>

        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">
                <i class="fas fa-camera"></i> Start
            </button>
            <button class="btn btn-danger hidden" id="stopBtn">
                <i class="fas fa-stop"></i> Stop
            </button>
        </div>

        <div style="margin-top: 12px; text-align: center; font-size: 11px; color: #95a5a6;">
            <i class="fas fa-info-circle"></i> Point camera at QR code
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        // ========================================
        // STATE
        // ========================================
        let html5QrCode = null;
        let isScanning = false;
        let lastScannedData = '';
        let scannedEmail = '';
        let scannedLRN = '';
        let scanLocked = false;         // true while waiting for form confirmation
        let confirmationTimeout = null;

        const statusMessage = document.getElementById('statusMessage');
        const resultDiv = document.getElementById('result');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // ========================================
        // START SCANNER
        // ========================================
        function startScanner() {
            if (html5QrCode) {
                try {
                    html5QrCode.stop().then(function() {
                        html5QrCode.clear();
                        html5QrCode = null;
                    }).catch(function() { html5QrCode = null; });
                } catch(e) { html5QrCode = null; }
            }

            startBtn.disabled = true;
            startBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            statusMessage.className = 'status-box status-info';
            statusMessage.innerHTML = '<span class="scan-animation"></span> Opening camera...';

            if (typeof Html5Qrcode === 'undefined') {
                statusMessage.className = 'status-box status-error';
                statusMessage.innerHTML = '❌ QR library not loaded. Please refresh.';
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-camera"></i> Retry';
                return;
            }

            try {
                document.getElementById('reader').innerHTML = '';
                html5QrCode = new Html5Qrcode("reader");

                const config = {
                    fps: 30,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                };

                html5QrCode.start(
                    { facingMode: 'environment' },
                    config,
                    onScanSuccess,
                    onScanError
                ).then(function() {
                    isScanning = true;
                    scanLocked = false;
                    lastScannedData = '';
                    scannedEmail = '';
                    scannedLRN = '';
                    statusMessage.className = 'status-box status-success';
                    statusMessage.innerHTML = '✅ <span class="scan-animation"></span> Scanner active. Point at QR code.';
                    startBtn.classList.add('hidden');
                    stopBtn.classList.remove('hidden');
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-camera"></i> Start';
                }).catch(function(err) {
                    console.warn('Scanner error:', err.message);
                    let errorMsg = err.message;
                    if (errorMsg.includes('NotAllowedError')) errorMsg = 'Camera access denied. Please allow camera access.';
                    else if (errorMsg.includes('NotFoundError')) errorMsg = 'No camera found on this device.';
                    statusMessage.className = 'status-box status-error';
                    statusMessage.innerHTML = '❌ ' + errorMsg;
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-camera"></i> Retry';
                });
            } catch (err) {
                statusMessage.className = 'status-box status-error';
                statusMessage.innerHTML = '❌ Failed to start: ' + err.message;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-camera"></i> Retry';
            }
        }

        // ========================================
        // STOP SCANNER
        // ========================================
        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(function() {
                    isScanning = false;
                    stopBtn.classList.add('hidden');
                    startBtn.classList.remove('hidden');
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-camera"></i> Start';
                    statusMessage.className = 'status-box status-info';
                    statusMessage.innerHTML = '⏹️ Scanner stopped.';
                }).catch(function() {});
            } else {
                stopBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-camera"></i> Start';
            }
        }

        // ========================================
        // SEND DATA TO FORM
        // ========================================
        function sendToAttendanceForm() {
            if (!scannedEmail && !scannedLRN) return;

            let dataToSend = '';
            if (scannedEmail && scannedLRN) dataToSend = scannedEmail + '|' + scannedLRN;
            else if (scannedLRN) dataToSend = scannedLRN;
            else dataToSend = scannedEmail;

            // Send to opener (popup) and parent (iframe)
            if (window.opener && window.opener !== window) {
                try { window.opener.postMessage({ type: 'LRN_SCANNED', lrn: dataToSend }, '*'); } catch(e) {}
            }
            if (window.parent && window.parent !== window) {
                try { window.parent.postMessage({ type: 'LRN_SCANNED', lrn: dataToSend }, '*'); } catch(e) {}
            }

            resultDiv.innerHTML = `
                <div class="status-box status-info">
                    <i class="fas fa-spinner fa-spin"></i>
                    Data sent — waiting for form to confirm...<br>
                    <small style="font-size: 11px; color: #6c757d;">
                        Please do NOT scan another QR code.
                    </small>
                </div>
            `;
            statusMessage.className = 'status-box status-warning';
            statusMessage.innerHTML = '⏳ Waiting for submission to complete...';

            // Safety net
            if (confirmationTimeout) clearTimeout(confirmationTimeout);
            confirmationTimeout = setTimeout(function() {
                if (scanLocked) {
                    console.warn('⚠️ No confirmation within 20s — unlocking.');
                    resetScannerForNextStudent('⚠️ No response from form. Ready to scan again.');
                }
            }, 20000);
        }

        // ========================================
        // RESET SCANNER FOR NEXT STUDENT (keeps window open)
        // ========================================
        function resetScannerForNextStudent(message) {
            if (confirmationTimeout) { clearTimeout(confirmationTimeout); confirmationTimeout = null; }
            scanLocked = false;
            lastScannedData = '';
            scannedEmail = '';
            scannedLRN = '';

            resultDiv.innerHTML = `
                <div class="status-box status-success">
                    <i class="fas fa-check-circle"></i>
                    ${message || '✅ Ready for next student.'}<br>
                    <small style="font-size: 11px; color: #6c757d;">
                        Please scan the next QR code.
                    </small>
                </div>
            `;
            statusMessage.className = 'status-box status-success';
            statusMessage.innerHTML = '✅ <span class="scan-animation"></span> Scanner ready. Point at QR code.';
        }

        // ========================================
        // SCAN SUCCESS
        // ========================================
        function onScanSuccess(decodedText, decodedResult) {
            if (scanLocked) {
                console.log('🔒 Locked — ignoring scan.');
                return;
            }
            if (lastScannedData === decodedText) return;
            lastScannedData = decodedText;

            console.log('📋 QR Scanned:', decodedText);

            let email = '';
            let lrn = '';

            if (decodedText.includes('|')) {
                const parts = decodedText.split('|');
                email = parts[0]?.trim() || '';
                lrn = parts[1]?.trim() || '';
            } else if (/^\d{12}$/.test(decodedText)) {
                lrn = decodedText;
            } else if (decodedText.includes('@')) {
                email = decodedText;
            } else {
                const m = decodedText.match(/\d{12}/);
                if (m) lrn = m[0];
            }

            scannedEmail = email;
            scannedLRN = lrn;
            scanLocked = true;   // lock until form confirms

            let html = `
                <div class="scanned-data">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-weight: 600; color: #28a745;">
                            <i class="fas fa-check-circle"></i> QR Code Detected!
                        </span>
                        <span style="font-size: 11px; color: #6c757d;">${new Date().toLocaleTimeString()}</span>
                    </div>
            `;
            if (email) html += `<div><span class="label">📧 Email:</span> <span class="value">${email}</span></div>`;
            if (lrn) html += `<div><span class="label">🔢 LRN:</span> <span class="value">${lrn}</span></div>`;
            if (!email && !lrn) html += `<div><span class="label">📋 Raw Data:</span> <span class="value">${decodedText}</span></div>`;
            html += `</div>`;
            resultDiv.innerHTML = html;

            setTimeout(function() { sendToAttendanceForm(); }, 400);
        }

        function onScanError(errorMessage) { /* silent */ }

        // ========================================
        // EVENT LISTENERS
        // ========================================
        startBtn.addEventListener('click', startScanner);
        stopBtn.addEventListener('click', stopScanner);

        window.addEventListener('DOMContentLoaded', function() {
            function checkLibraryAndStart() {
                if (typeof Html5Qrcode !== 'undefined') {
                    statusMessage.className = 'status-box status-info';
                    statusMessage.innerHTML = '📷 Ready. Starting camera...';
                    setTimeout(startScanner, 500);
                } else {
                    setTimeout(checkLibraryAndStart, 300);
                }
            }
            setTimeout(checkLibraryAndStart, 500);
        });

        window.addEventListener('beforeunload', function() { stopScanner(); });

        // ========================================
        // LISTEN FOR FORM RESPONSES
        // ========================================
        window.addEventListener('message', function(event) {
            if (!event.data || !event.data.type) return;
            console.log('📨 Message from form:', event.data);

            // ── SUCCESS ──
            if (event.data.type === 'SCAN_CONFIRMED') {
                resetScannerForNextStudent('✅ Attendance submitted successfully!');
            }

            // ── ALREADY ATTENDED ──
            if (event.data.type === 'SCAN_ALREADY_ATTENDED') {
                resetScannerForNextStudent('ℹ️ This student already attended today.');
            }

            // ── ERROR ──
            if (event.data.type === 'SCAN_ERROR') {
                if (confirmationTimeout) { clearTimeout(confirmationTimeout); confirmationTimeout = null; }
                scanLocked = false;
                lastScannedData = '';
                resultDiv.innerHTML = `
                    <div class="status-box status-error">
                        <i class="fas fa-exclamation-triangle"></i>
                        ❌ ${event.data.message || 'Submission failed'}<br>
                        <small style="font-size: 11px;">Please scan again.</small>
                    </div>
                `;
                statusMessage.className = 'status-box status-info';
                statusMessage.innerHTML = '✅ <span class="scan-animation"></span> Scanner ready again.';
            }
        });
    </script>
</body>
</html>
