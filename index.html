<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MBHS - QR Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            touch-action: manipulation;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-height: 99vh;
            overflow-y: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h2 {
            color: #2c3e50;
            font-size: 20px;
        }
        .header p {
            color: #7f8c8d;
            font-size: 13px;
        }
        #reader-container {
            width: 100%;
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            min-height: 300px;
            max-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reader-container video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            display: block;
        }
        #result {
            margin-top: 12px;
            text-align: center;
            min-height: 40px;
            font-size: 14px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
        }
        .btn-primary:active { transform: scale(0.95); }
        .btn-success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        .btn-success:active { transform: scale(0.95); }
        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }
        .btn-danger:active { transform: scale(0.95); }
        
        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-group .btn { flex: 1; min-width: 80px; }
        
        .status-box {
            padding: 8px 12px;
            border-radius: 6px;
            margin: 8px 0;
            text-align: center;
            font-size: 13px;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
            border-left: 3px solid #28a745;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 3px solid #dc3545;
        }
        .status-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 3px solid #17a2b8;
        }
        .hidden { display: none !important; }
        
        .scanned-data {
            background: #d4edda;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #28a745;
            margin: 8px 0;
            text-align: left;
            font-size: 13px;
        }
        .scanned-data .label { font-weight: 600; color: #2c3e50; }
        .scanned-data .value { color: #155724; font-weight: 500; }
        
        .scan-animation {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            animation: pulse 1.5s ease-in-out infinite;
            margin-right: 6px;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        .auto-send-timer {
            color: #6c757d;
            font-size: 12px;
            margin-top: 4px;
        }
        .auto-send-timer .countdown {
            font-weight: 700;
            color: #6c5ce7;
        }
        
        @media (max-width: 500px) {
            .container { padding: 12px 14px; }
            #reader-container { min-height: 250px; max-height: 300px; }
            .header h2 { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📷 QR Code Scanner</h2>
            <p>Scan the QR code to mark attendance</p>
        </div>
        
        <div id="statusMessage" class="status-box status-info">
            <span class="scan-animation"></span> Initializing camera...
        </div>
        
        <div id="reader-container">
            <div id="reader"></div>
        </div>
        
        <div id="result"></div>
        
        <div class="btn-group">
            <button class="btn btn-primary" id="startBtn">
                <i class="fas fa-camera"></i> Start
            </button>
            <button class="btn btn-danger hidden" id="stopBtn">
                <i class="fas fa-stop"></i> Stop
            </button>
            <button class="btn btn-success hidden" id="sendBtn">
                <i class="fas fa-paper-plane"></i> Send to Form
            </button>
        </div>
        
        <div style="margin-top: 12px; text-align: center; font-size: 11px; color: #95a5a6;">
            <i class="fas fa-info-circle"></i> Point camera at QR code
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script>
        // ========================================
        // QR SCANNER CONFIGURATION
        // ========================================
        let html5QrCode = null;
        let isScanning = false;
        let lastScannedData = '';
        let scannedEmail = '';
        let scannedLRN = '';
        let sendTimeout = null;
        let countdownInterval = null;
        
        const statusMessage = document.getElementById('statusMessage');
        const resultDiv = document.getElementById('result');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sendBtn = document.getElementById('sendBtn');
        
        // ========================================
        // START SCANNER
        // ========================================
        function startScanner() {
            if (html5QrCode) {
                try {
                    html5QrCode.stop().then(function() {
                        html5QrCode.clear();
                        html5QrCode = null;
                    }).catch(function() { html5QrCode = null; });
                } catch(e) { html5QrCode = null; }
            }
            
            startBtn.disabled = true;
            startBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            statusMessage.className = 'status-box status-info';
            statusMessage.innerHTML = '<span class="scan-animation"></span> Opening camera...';
            
            if (typeof Html5Qrcode === 'undefined') {
                statusMessage.className = 'status-box status-error';
                statusMessage.innerHTML = '❌ QR library not loaded. Please refresh.';
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-camera"></i> Retry';
                return;
            }
            
            try {
                const readerElement = document.getElementById('reader');
                readerElement.innerHTML = '';
                
                html5QrCode = new Html5Qrcode("reader");
                
                const config = {
                    fps: 30,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                };
                
                html5QrCode.start(
                    { facingMode: 'environment' },
                    config,
                    onScanSuccess,
                    onScanError
                ).then(function() {
                    isScanning = true;
                    statusMessage.className = 'status-box status-success';
                    statusMessage.innerHTML = '✅ <span class="scan-animation"></span> Scanner active. Point at QR code.';
                    startBtn.classList.add('hidden');
                    stopBtn.classList.remove('hidden');
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-camera"></i> Start';
                }).catch(function(err) {
                    console.warn('Scanner error:', err.message);
                    let errorMsg = err.message;
                    if (errorMsg.includes('NotAllowedError')) {
                        errorMsg = 'Camera access denied. Please allow camera access.';
                    } else if (errorMsg.includes('NotFoundError')) {
                        errorMsg = 'No camera found on this device.';
                    }
                    statusMessage.className = 'status-box status-error';
                    statusMessage.innerHTML = '❌ ' + errorMsg;
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-camera"></i> Retry';
                });
            } catch (err) {
                console.warn('Error:', err.message);
                statusMessage.className = 'status-box status-error';
                statusMessage.innerHTML = '❌ Failed to start: ' + err.message;
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-camera"></i> Retry';
            }
        }
        
        // ========================================
        // STOP SCANNER
        // ========================================
        function stopScanner() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(function() {
                    isScanning = false;
                    stopBtn.classList.add('hidden');
                    startBtn.classList.remove('hidden');
                    startBtn.disabled = false;
                    startBtn.innerHTML = '<i class="fas fa-camera"></i> Start';
                    statusMessage.className = 'status-box status-info';
                    statusMessage.innerHTML = '⏹️ Scanner stopped.';
                }).catch(function() {});
            } else {
                stopBtn.classList.add('hidden');
                startBtn.classList.remove('hidden');
                startBtn.disabled = false;
                startBtn.innerHTML = '<i class="fas fa-camera"></i> Start';
            }
        }
        
        // ========================================
        // SEND DATA TO ATTENDANCE FORM
        // ========================================
        function sendToAttendanceForm() {
            // Clear any pending timeouts
            if (sendTimeout) {
                clearTimeout(sendTimeout);
                sendTimeout = null;
            }
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            
            if (!scannedEmail && !scannedLRN && !lastScannedData) {
                resultDiv.innerHTML = '<div class="status-box status-error">❌ No QR code scanned yet.</div>';
                return;
            }
            
            // Build the data string
            let dataToSend = '';
            if (scannedEmail && scannedLRN) {
                dataToSend = scannedEmail + '|' + scannedLRN;
            } else if (scannedLRN) {
                dataToSend = scannedLRN;
            } else if (scannedEmail) {
                dataToSend = scannedEmail;
            } else {
                dataToSend = lastScannedData;
            }
            
            console.log('📤 Sending data:', dataToSend);
            
            // Try to send to parent window (if in iframe)
            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({
                        type: 'LRN_SCANNED',
                        lrn: dataToSend
                    }, '*');
                    console.log('✅ Sent to parent window');
                } catch(e) {
                    console.warn('Could not send to parent:', e);
                }
            }
            
            // Try to send to opener (if opened as popup)
            if (window.opener && window.opener !== window) {
                try {
                    window.opener.postMessage({
                        type: 'LRN_SCANNED',
                        lrn: dataToSend
                    }, '*');
                    console.log('✅ Sent to opener window');
                } catch(e) {
                    console.warn('Could not send to opener:', e);
                }
            }
            
            // Also try to send to all parent windows via broadcast
            try {
                window.postMessage({
                    type: 'LRN_SCANNED',
                    lrn: dataToSend
                }, '*');
                console.log('✅ Sent to current window');
            } catch(e) {
                console.warn('Could not send to current:', e);
            }
            
            // Show success message
            resultDiv.innerHTML = `
                <div class="status-box status-success">
                    <i class="fas fa-check-circle"></i> 
                    ✅ Data sent to attendance form!<br>
                    <small style="font-size: 11px; color: #6c757d;">
                        ${dataToSend}
                    </small>
                </div>
            `;
            
            sendBtn.classList.add('hidden');
            
            // Try to close the window after 2 seconds
            setTimeout(function() {
                try {
                    window.close();
                } catch(e) {
                    console.log('Window will stay open (not opened by script)');
                }
            }, 2000);
        }
        
        // ========================================
        // SCAN SUCCESS - UPDATED to send data immediately
        // ========================================
        function onScanSuccess(decodedText, decodedResult) {
            // Prevent duplicate scans
            if (lastScannedData === decodedText) {
                return;
            }
            lastScannedData = decodedText;
            
            console.log('📋 QR Scanned:', decodedText);
            console.log('📋 Full result:', decodedResult);
            
            // Parse the QR data
            let email = '';
            let lrn = '';
            
            if (decodedText.includes('|')) {
                const parts = decodedText.split('|');
                email = parts[0]?.trim() || '';
                lrn = parts[1]?.trim() || '';
            } else if (/^\d{12}$/.test(decodedText)) {
                lrn = decodedText;
            } else if (decodedText.includes('@')) {
                email = decodedText;
            } else {
                // Try to find LRN in the text
                const lrnMatch = decodedText.match(/\d{12}/);
                if (lrnMatch) {
                    lrn = lrnMatch[0];
                }
            }
            
            scannedEmail = email;
            scannedLRN = lrn;
            
            // Show scanned data
            let html = `
                <div class="scanned-data">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-weight: 600; color: #28a745;">
                            <i class="fas fa-check-circle"></i> QR Code Detected!
                        </span>
                        <span style="font-size: 11px; color: #6c757d;">${new Date().toLocaleTimeString()}</span>
                    </div>
            `;
            
            if (email) {
                html += `<div><span class="label">📧 Email:</span> <span class="value">${email}</span></div>`;
            }
            if (lrn) {
                html += `<div><span class="label">🔢 LRN:</span> <span class="value">${lrn}</span></div>`;
            }
            if (!email && !lrn) {
                html += `<div><span class="label">📋 Raw Data:</span> <span class="value">${decodedText}</span></div>`;
            }
            
            html += `
                    <div style="margin-top: 8px; font-size: 12px; color: #6c5ce7;">
                        <i class="fas fa-paper-plane"></i> Sending to attendance form...
                    </div>
                </div>
            `;
            resultDiv.innerHTML = html;
            
            // Show send button
            sendBtn.classList.remove('hidden');
            
            // Send immediately with a small delay to ensure the UI updates
            setTimeout(function() {
                sendToAttendanceForm();
            }, 500);
        }
        
        function onScanError(errorMessage) {
            // Silent - errors are expected during scanning
        }
        
        // ========================================
        // EVENT LISTENERS
        // ========================================
        startBtn.addEventListener('click', startScanner);
        stopBtn.addEventListener('click', stopScanner);
        sendBtn.addEventListener('click', sendToAttendanceForm);
        
        // ========================================
        // START ON PAGE LOAD
        // ========================================
        window.addEventListener('DOMContentLoaded', function() {
            function checkLibraryAndStart() {
                if (typeof Html5Qrcode !== 'undefined') {
                    statusMessage.className = 'status-box status-info';
                    statusMessage.innerHTML = '📷 Ready. Starting camera...';
                    setTimeout(function() {
                        startScanner();
                    }, 500);
                } else {
                    setTimeout(checkLibraryAndStart, 300);
                }
            }
            setTimeout(checkLibraryAndStart, 500);
        });
        
        window.addEventListener('beforeunload', function() {
            stopScanner();
        });
        
        // Listen for messages from parent (to confirm data received)
        window.addEventListener('message', function(event) {
            console.log('📨 Message received in scanner:', event.data);
            if (event.data && event.data.type === 'SCAN_CONFIRMED') {
                // Data was received by the attendance form
                console.log('✅ Attendance form confirmed receipt');
                resultDiv.innerHTML = `
                    <div class="status-box status-success">
                        <i class="fas fa-check-circle"></i> 
                        ✅ Data received by attendance form!<br>
                        <small style="font-size: 11px; color: #6c757d;">
                            You can close this window now.
                        </small>
                    </div>
                `;
                sendBtn.classList.add('hidden');
                setTimeout(function() {
                    try { window.close(); } catch(e) {}
                }, 1500);
            }
        });
    </script>
</body>
</html>
